# =============================================================================
# Scaffold Backend — 公共默认配置（application.properties）
# -----------------------------------------------------------------------------
# 说明：
#   1. 本文件为所有环境的默认值；dev / prod 仅覆盖差异项。
#   2. 激活环境：spring.profiles.active=dev|prod（可用环境变量 SPRING_PROFILES_ACTIVE 覆盖）。
#   3. 配置按功能域分区，便于对照 application-dev.properties / application-prod.properties。
#   4. 敏感项（JWT secret、数据库口令等）生产务必用环境变量或密钥注入覆盖。
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 应用基础
# -----------------------------------------------------------------------------
# 应用名：用于日志 appName、Micrometer 标签等
spring.application.name=app-backend
# 默认激活开发环境；生产部署请使用 prod 或通过环境变量覆盖
spring.profiles.active=dev

# -----------------------------------------------------------------------------
# 2. HTTP 服务 / Tomcat / 虚拟线程
# -----------------------------------------------------------------------------
# 服务监听端口
server.port=18080
# 启用 JDK 21 虚拟线程（Spring 异步、Tomcat 请求等可受益）
# 开启后 Tomcat 用虚拟线程执行器处理请求，server.tomcat.threads.max / min-spare 不再生效，
# 并发背压由 max-connections / accept-count 与下游连接池（Hikari、Jedis）大小决定
spring.threads.virtual.enabled=true
# 等待处理的连接队列长度
server.tomcat.accept-count=5000
# 最大连接数
server.tomcat.max-connections=30000
# 连接超时（毫秒）
server.tomcat.connection-timeout=5000
# HTTP 请求头大小上限
server.tomcat.max-http-request-header-size=8KB
# 启用 HTTP/2
server.http2.enabled=true

# -----------------------------------------------------------------------------
# 3. Spring MVC 异步
# -----------------------------------------------------------------------------
# 异步请求超时（毫秒）。与 SSE 长连接（约 30min）对齐，避免容器默认过短提前掐断
spring.mvc.async.request-timeout=1800000

# -----------------------------------------------------------------------------
# 4. OpenAPI / SpringDoc
# -----------------------------------------------------------------------------
# Swagger UI 入口路径
springdoc.swagger-ui.path=/swagger-ui.html
# OpenAPI 文档 JSON 路径
springdoc.api-docs.path=/v3/api-docs

# -----------------------------------------------------------------------------
# 5. 监控 / Actuator / Metrics
# -----------------------------------------------------------------------------
# Actuator 统一挂到 /api 前缀下，便于网关与安全规则
management.endpoints.web.base-path=/api/actuator
# 对外暴露的端点：健康检查、基础信息、Prometheus 指标
management.endpoints.web.exposure.include=health,info,prometheus
# 启用 Kubernetes 风格探针（liveness/readiness）
management.endpoint.health.probes.enabled=true
# 健康详情：仅授权用户可见（dev 可覆盖为 always）
management.endpoint.health.show-details=when_authorized
# 导出 Prometheus 指标
management.prometheus.metrics.export.enabled=true
# 指标统一打应用名标签
management.metrics.tags.application=${spring.application.name}
# HTTP 服务端请求耗时直方图
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# HTTP 请求百分位：P50 / P95 / P99
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# -----------------------------------------------------------------------------
# 6. 认证 / JWT
# -----------------------------------------------------------------------------
# HS256 签名密钥：生产务必替换为足够长的随机串（建议 ≥32 字节）
auth.jwt.secret=ChangeMeToA32ByteOrLongerSecretKeyForHS256
# 访问令牌有效期（秒），默认 30 分钟
auth.jwt.access-expire-seconds=1800
# 刷新令牌有效期（秒），默认 7 天
auth.jwt.refresh-expire-seconds=604800
# 本地/调试用静态测试 token（生产勿依赖此值）
auth.jwt.test-token=semi123456
# OAuth2 等开关与前端回跳 URL 默认写在系统配置种子数据（system-data.sql），不在此重复声明

# -----------------------------------------------------------------------------
# 7. MyBatis-Plus
# -----------------------------------------------------------------------------
# 逻辑删除字段名（表字段 deleted_at）
mybatis-plus.global-config.db-config.logic-delete-field=deleted_at
# 未删除标记：NULL 表示未删除
mybatis-plus.global-config.db-config.logic-not-delete-value=null
# 删除时写入当前时间（数据库 now()）
mybatis-plus.global-config.db-config.logic-delete-value=now()
# SQL 单行日志实现仅在 dev 打开（见 application-dev.properties）

# -----------------------------------------------------------------------------
# 8. 日志（与 logback-spring.xml 配合）
# -----------------------------------------------------------------------------
# 是否启用 @AuditLog 审计切面
logging.audit-enabled=true
# 是否启用 Service/Repository 性能切面
logging.performance-enabled=true
# 逐条 SQL 日志开关（仅在 mybatis-plus log-impl=SqlSingleLineLog 且 mapper logger 为 DEBUG 时才有输出）
logging.sql-log-enabled=true
# 日志文件目录（prod 容器通常覆盖为 /app/logs/）
logging.file-path=logs/
# 单个滚动文件最大体积
logging.file-max-size=50MB
# 管理端「全量预览」允许的最大文件字节数（超限请下载）
logging.log-file-preview.max-bytes=104857600
# 滚动文件保留天数
logging.file-max-history=30
# 异步 Appender 队列容量（高峰可丢弃 app/sql；audit/error 优先不丢）
logging.async-queue-size=512
# 审计 payload 等是否脱敏
logging.masking-enabled=true
# 控制台最低级别：非 dev 只输出告警（完整运行日志看 app.log）；格式由 profile 决定，dev 文本，其余 JSON
logging.console-threshold=WARN
# 各通道文件名（logType 与前端日志文件页 / LogFileType 对应）
logging.app-log-file=app.log
logging.audit-log-file=audit.log
logging.sql-log-file=sql.log
logging.error-log-file=error.log
logging.performance-log-file=performance.log

# -----------------------------------------------------------------------------
# 9. 短雪花 ID
# -----------------------------------------------------------------------------
# --- 短雪花 ID ---
# 多实例部署时 worker-id 必须唯一（0 ~ 2^worker-id-bit-length - 1）
app.id-generator.worker-id=0
# 起始时间戳（毫秒）
app.id-generator.base-time=1767196800000
# worker 位数
app.id-generator.worker-id-bit-length=6
# 序列号位数
app.id-generator.seq-bit-length=6

# -----------------------------------------------------------------------------
# 10. 透明查询缓存（MyBatis 层，Redis 存储，二开无感知）
# -----------------------------------------------------------------------------
# 所有 SELECT 默认缓存；写入经 MyBatis 后按「表版本号」自动失效；Redis 异常自动降级直连库
app.cache.enabled=true
app.cache.key-prefix=app:qc
# 兜底 TTL：仅覆盖绕过 MyBatis 的写入（手工 SQL / 迁移脚本）
app.cache.default-ttl=5m
# 单次结果超过此行数不缓存
app.cache.max-rows=1000
# 不缓存的表（* 通配）；日志/历史表默认排除
app.cache.exclude-tables=hist_*,mes_*,flyway_schema_history
app.mes.enabled=true
# 仅缓存这些表（留空=不限制），例：app.cache.include-tables=sys_*
# app.cache.include-tables=
# 按表覆盖 TTL，例：app.cache.table-ttl.sys_dict_item=1h
# 方法级覆盖：Mapper 方法加 @NoCache / @CacheTtl(seconds = 60)

# -----------------------------------------------------------------------------
# 11. 启动库迁移（Flyway）+ 在线更版
# -----------------------------------------------------------------------------
# 关掉 Spring SQL init，避免与 Flyway 双跑 schema / 种子
spring.sql.init.mode=never
spring.flyway.enabled=true
# 目录由 VendorFlywayConfiguration 按 app.db / JDBC URL 覆盖为 db/migration/{vendor}
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.encoding=UTF-8
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.0.0
spring.flyway.baseline-description=existing-schema
# 种子 SQL / JSON 里有花括号，禁止占位符替换
spring.flyway.placeholder-replacement=false
spring.flyway.validate-on-migrate=true
# 关系库种类：留空则按 spring.datasource.url 推断（mysql/postgresql/oracle/sqlserver）
# app.db.type=mysql
# --- 在线更版（内网 zip：app.jar + version.json）---
app.release.home=${APP_RELEASE_HOME:/opt/scaffold}
app.release.max-upload-bytes=536870912
app.release.restart-delay-ms=2500
app.release.keep-count=5
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

