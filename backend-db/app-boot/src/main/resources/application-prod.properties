# =============================================================================
# Scaffold Backend — 生产 / 容器环境（application-prod.properties）
# -----------------------------------------------------------------------------
# 激活方式：SPRING_PROFILES_ACTIVE=prod（见 docker/single/docker-compose.yml）
# 原则：仅覆盖「与公共默认不同」的项；主机名面向 Docker 内网服务名。
# 功能域顺序与 application.properties / application-dev.properties 对齐。
# 敏感项（密码、JWT secret）生产建议用环境变量或密钥注入覆盖，勿提交真实密钥。
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 应用基础
# -----------------------------------------------------------------------------
# （无覆盖）spring.application.name 等见公共配置

# -----------------------------------------------------------------------------
# 2. HTTP 服务 / Tomcat / 虚拟线程
# -----------------------------------------------------------------------------
# （无覆盖）端口通常由容器/编排映射；线程参数沿用公共默认

# -----------------------------------------------------------------------------
# 3. Spring MVC 异步
# -----------------------------------------------------------------------------
# （无覆盖）SSE 长连接超时沿用公共配置

# -----------------------------------------------------------------------------
# 4. OpenAPI / SpringDoc
# -----------------------------------------------------------------------------
# （无覆盖）若生产需关闭文档，可在此增加 springdoc 关闭项或网关拦截

# -----------------------------------------------------------------------------
# 5. 监控 / Actuator / Metrics
# -----------------------------------------------------------------------------
# 健康详情仅授权可见（与公共一致，此处显式声明便于运维检索）
management.endpoint.health.show-details=when_authorized

# -----------------------------------------------------------------------------
# 6. 认证 / JWT
# -----------------------------------------------------------------------------
# （无覆盖）请通过环境变量覆盖 auth.jwt.secret 与令牌有效期
# 示例：AUTH_JWT_SECRET，或 Spring 宽松绑定 AUTH_JWT_SECRET 等

# -----------------------------------------------------------------------------
# 7. MyBatis-Plus
# -----------------------------------------------------------------------------
# （无覆盖）生产不开启 SqlSingleLineLog；业务 logger 为 INFO，默认不刷全量 SQL

# -----------------------------------------------------------------------------
# 8. 日志
# -----------------------------------------------------------------------------
# 容器内日志目录（需挂载 volume，便于采集与落盘）
logging.file-path=/app/logs/
# 无日志采集：stdout 只留告警（JSON），排查以 app.log / 管理端日志文件页为准
logging.console-threshold=WARN
# 各通道文件名（与公共一致，显式写出便于容器侧挂载/采集配置对照）
logging.app-log-file=app.log
logging.audit-log-file=audit.log
logging.sql-log-file=sql.log
logging.error-log-file=error.log
logging.performance-log-file=performance.log
# 生产流量更大，异步队列加大，降低高峰丢日志概率
logging.async-queue-size=2048
logging.file-max-size=100MB
logging.file-max-history=30
# 脱敏保持开启
logging.masking-enabled=true
logging.audit-enabled=true
logging.performance-enabled=true

# -----------------------------------------------------------------------------
# 9. Redis（令牌会话 / OAuth2 ticket）— Docker 服务名 redis
# -----------------------------------------------------------------------------
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=password
spring.data.redis.timeout=5000ms

# -----------------------------------------------------------------------------
# 10. 短雪花 ID
# -----------------------------------------------------------------------------
# （无覆盖）多实例部署务必通过环境变量设置不同的：
#   app.id-generator.worker-id
# 避免短雪花 ID 冲突

# -----------------------------------------------------------------------------
# 11. 透明查询缓存
# -----------------------------------------------------------------------------
# （无覆盖）见公共配置 app.cache.*

# -----------------------------------------------------------------------------
# 12. 启动库迁移 / 在线更版
# -----------------------------------------------------------------------------
# （无覆盖）Flyway 在启动时迁移；更版根目录可用 APP_RELEASE_HOME 覆盖
# app.release.home=/opt/scaffold

# -----------------------------------------------------------------------------
# 13. MySQL
# -----------------------------------------------------------------------------
# Docker 服务名 mysql，库名 scaffold_prod（请按实际库名修改）
spring.datasource.url=jdbc:mysql://mysql:3306/scaffold_prod?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# --- HikariCP（prod：更大连接池）---
spring.datasource.hikari.maximum-pool-size=128
spring.datasource.hikari.minimum-idle=32
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
