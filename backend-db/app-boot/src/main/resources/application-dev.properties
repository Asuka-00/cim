# =============================================================================
# Scaffold Backend — 开发环境（application-dev.properties）
# -----------------------------------------------------------------------------
# 激活方式：spring.profiles.active=dev（默认已在 application.properties 中指定）
# 原则：仅覆盖「与公共默认不同」的项；未写出的配置继承 application.properties。
# 功能域顺序与 application.properties 保持一致，便于 diff 对照。
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 应用基础
# -----------------------------------------------------------------------------
# （无覆盖）应用名、默认 profile 等见 application.properties

# -----------------------------------------------------------------------------
# 2. HTTP 服务 / Tomcat / 虚拟线程
# -----------------------------------------------------------------------------
# （无覆盖）本地默认端口 18080、虚拟线程等沿用公共配置

# -----------------------------------------------------------------------------
# 3. Spring MVC 异步
# -----------------------------------------------------------------------------
# （无覆盖）SSE 超时沿用 30 分钟

# -----------------------------------------------------------------------------
# 4. OpenAPI / SpringDoc
# -----------------------------------------------------------------------------
# （无覆盖）本地可直接访问 /swagger-ui.html

# -----------------------------------------------------------------------------
# 5. 监控 / Actuator / Metrics
# -----------------------------------------------------------------------------
# 开发环境健康检查详情始终展示，便于排查依赖（MySQL 等）
management.endpoint.health.show-details=always

# -----------------------------------------------------------------------------
# 6. 认证 / JWT
# -----------------------------------------------------------------------------
# 访问令牌放宽为 2 小时，减少本地调试频繁登录
auth.jwt.access-expire-seconds=7200
# 刷新令牌 1 天
auth.jwt.refresh-expire-seconds=86400
# 开发专用测试 token（勿用于生产）
auth.jwt.test-token=dev_test_token_123456

# -----------------------------------------------------------------------------
# 7. MyBatis-Plus
# -----------------------------------------------------------------------------
# 开发环境开启 SQL 单行日志实现（输出到 logger=SQL → sql.log + 控制台）
# 生产默认不配置此项，且业务 logger 为 INFO，避免全量 SQL 刷盘
mybatis-plus.configuration.log-impl=com.scaffold.share.logging.SqlSingleLineLog
# 逐条 SQL 日志默认关闭（异步写库量大，会刷屏并拖慢控制台）；排查 SQL 时改 true 重启
logging.sql-log-enabled=false

# -----------------------------------------------------------------------------
# 8. 日志
# -----------------------------------------------------------------------------
# 本地日志目录（相对进程工作目录）
logging.file-path=logs/
# 本地控制台输出业务 DEBUG（dev profile 下为人类可读文本）
logging.console-threshold=DEBUG
# 各通道文件名（与 LogFileType / 前端日志页一致；一般与公共相同，此处显式便于本地查阅）
logging.app-log-file=app.log
logging.audit-log-file=audit.log
logging.sql-log-file=sql.log
logging.error-log-file=error.log
logging.performance-log-file=performance.log
# 本地 SQL / DEBUG 较多，异步队列可略放大
logging.async-queue-size=1024
# 单文件可稍大，方便本地连续调试
logging.file-max-size=100MB
# 本地保留天数缩短，避免磁盘被历史日志占满
logging.file-max-history=7
# 开发关闭脱敏，便于对照请求体与库字段
logging.masking-enabled=false
# 审计 / 性能切面（与公共一致，显式写出便于开关）
logging.audit-enabled=true
logging.performance-enabled=true

# -----------------------------------------------------------------------------
# 9. Redis（令牌会话 / OAuth2 ticket）— 环境相关连接信息
# -----------------------------------------------------------------------------
spring.data.redis.host=192.168.12.1
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=password
spring.data.redis.timeout=2000ms

# -----------------------------------------------------------------------------
# 10. 短雪花 ID
# -----------------------------------------------------------------------------
# （无覆盖）id-generator 见公共配置
# 多实例本地联调时请为各实例设置不同的 app.id-generator.worker-id

# -----------------------------------------------------------------------------
# 11. 透明查询缓存
# -----------------------------------------------------------------------------
# （无覆盖）见公共配置 app.cache.*

# -----------------------------------------------------------------------------
# 12. 启动库迁移 / 在线更版
# -----------------------------------------------------------------------------
# （无覆盖）Flyway 沿用公共配置；本地更版目录写到工作区，避免写 /opt
app.release.home=./release-dev
app.release.restart-delay-ms=3000

# -----------------------------------------------------------------------------
# 13. MySQL — 环境相关连接信息
# -----------------------------------------------------------------------------
# 开发库 scaffold；rewriteBatchedStatements 利于批量写入；时区 Asia/Shanghai
spring.datasource.url=jdbc:mysql://192.168.12.1:3306/scaffold?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# --- HikariCP（dev）---
spring.datasource.hikari.maximum-pool-size=64
spring.datasource.hikari.minimum-idle=16
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# 连接泄漏检测阈值（毫秒），超时未归还会打 WARN
spring.datasource.hikari.leak-detection-threshold=30000
